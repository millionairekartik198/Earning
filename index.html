<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ELITE EARNER</title>
<style>
:root{
  --bg:#030C10;--s1:#071820;--s2:#0C2230;--s3:#112A3A;--s4:#173545;
  --cy:#00E5FF;--cy2:#00B8D4;--cy3:#80DEEA;--cya:rgba(0,229,255,.1);--cyd:rgba(0,229,255,.06);
  --tl:#00BFA5;--tl2:#00897B;--tla:rgba(0,191,165,.12);
  --tx:#E0F7FA;--tx2:#80DEEA;--tx3:#4A7A8A;
  --rd:#FF5252;--gr:#69F0AE;--yw:#FFD740;--pu:#CE93D8;--or:#FF9100;
  --bd:#1A3A4A;--r:14px;--r2:10px;--r3:7px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0);
  padding-bottom:env(safe-area-inset-bottom,0);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'Segoe UI',system-ui,sans-serif;overflow-x:hidden}
#app{min-height:100vh}
/* Header */
.hdr{position:fixed;top:0;left:0;right:0;z-index:200;
  background:rgba(3,12,16,.93);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--bd);
  padding:0 16px;padding-top:env(safe-area-inset-top,0);
  height:calc(58px + env(safe-area-inset-top,0));
  display:flex;align-items:flex-end;padding-bottom:10px;justify-content:space-between}
.hdr-logo{font-size:16px;font-weight:900;letter-spacing:3px;
  background:linear-gradient(135deg,#fff 0%,var(--cy) 50%,var(--tl) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.hdr-r{display:flex;gap:10px;align-items:center}
.icon-btn{background:none;border:none;color:var(--tx2);font-size:19px;cursor:pointer;padding:4px;position:relative;line-height:1}
.nbadge{position:absolute;top:-3px;right:-3px;background:var(--rd);color:#fff;
  border-radius:50%;width:16px;height:16px;font-size:8px;display:flex;align-items:center;justify-content:center;font-weight:800}
.hdr-out{background:none;border:1px solid var(--bd);color:var(--tx2);padding:5px 12px;
  border-radius:var(--r3);cursor:pointer;font-size:11px;font-weight:700;letter-spacing:.5px;transition:.15s}
.hdr-out:hover{border-color:var(--cy);color:var(--cy)}
/* Main */
.main{padding-top:calc(58px + env(safe-area-inset-top,0) + 2px);
  padding-bottom:calc(70px + env(safe-area-inset-bottom,0));min-height:100vh}
/* Tabs */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:200;
  background:rgba(3,12,16,.97);backdrop-filter:blur(16px);
  border-top:1px solid var(--bd);display:flex;
  padding-bottom:env(safe-area-inset-bottom,0)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;
  padding:9px 2px;cursor:pointer;color:var(--tx3);background:none;border:none;
  font-size:9px;letter-spacing:.2px;font-weight:700;text-transform:uppercase;transition:.15s}
.tab.act{color:var(--cy)}
.tab-i{font-size:18px;margin-bottom:2px}
/* Landing */
.lnd{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:32px 24px;text-align:center;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,#001C26 0%,var(--bg) 70%)}
.lnd-glow{width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,229,255,.2) 0%,transparent 70%);
  display:flex;align-items:center;justify-content:center;font-size:50px;
  border:1px solid rgba(0,229,255,.2);margin-bottom:16px;
  box-shadow:0 0 40px rgba(0,229,255,.15)}
.lnd-logo{font-size:32px;font-weight:900;letter-spacing:5px;
  background:linear-gradient(135deg,#fff 0%,var(--cy) 50%,var(--tl) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.lnd-tag{font-size:11px;color:var(--tx2);letter-spacing:3px;margin-bottom:48px}
.lnd-btns{display:flex;flex-direction:column;gap:12px;width:100%;max-width:290px}
/* Login */
.lgn{min-height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:24px;
  background:radial-gradient(ellipse 90% 60% at 50% 0%,#001C26 0%,var(--bg) 70%)}
.lgn-box{width:100%;max-width:380px;background:var(--s1);
  border:1px solid var(--bd);border-radius:var(--r);padding:28px}
.lgn-ico{font-size:32px;margin-bottom:10px}
.lgn-title{font-size:22px;font-weight:900;margin-bottom:4px;
  background:linear-gradient(135deg,#fff,var(--cy));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.lgn-sub{font-size:12px;color:var(--tx2);margin-bottom:22px;line-height:1.6}
/* Buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:7px;
  padding:13px 20px;border-radius:var(--r2);border:none;
  font-size:13px;font-weight:700;cursor:pointer;transition:.15s;width:100%;letter-spacing:.3px}
.btn:active{transform:scale(.97)}
.btn-cy{background:linear-gradient(135deg,var(--cy),var(--tl));color:#001020}
.btn-tl{background:linear-gradient(135deg,var(--tl),var(--tl2));color:#fff}
.btn-outline{background:transparent;border:1px solid var(--bd);color:var(--tx2)}
.btn-outline:hover{border-color:var(--cy);color:var(--cy)}
.btn-danger{background:var(--rd);color:#fff}
.btn-success{background:var(--gr);color:#002010}
.btn-purple{background:var(--pu);color:#1A0030}
.btn-sm{padding:9px 14px;font-size:12px}
.btn-xs{padding:5px 11px;font-size:11px;border-radius:var(--r3);display:inline-flex;width:auto;white-space:nowrap}
/* Inputs */
.ig{margin-bottom:13px}
.il{font-size:11px;color:var(--tx2);margin-bottom:5px;display:block;font-weight:700;letter-spacing:.3px;text-transform:uppercase}
.inp{width:100%;background:var(--s3);border:1px solid var(--bd);color:var(--tx);
  padding:12px 13px;border-radius:var(--r2);font-size:13px;outline:none;transition:.15s;-webkit-appearance:none}
.inp:focus{border-color:var(--cy);background:var(--s4);box-shadow:0 0 0 3px rgba(0,229,255,.08)}
.inp::placeholder{color:var(--tx3)}
textarea.inp{resize:vertical;min-height:75px}
select.inp option{background:var(--s3)}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-right:40px}
.inp-eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--tx3);cursor:pointer;font-size:15px}
/* Cards */
.card{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:16px}
.card-cy{border-color:rgba(0,229,255,.3);background:linear-gradient(135deg,var(--s2),#041520)}
/* Balance header */
.bal-hd{background:linear-gradient(135deg,#051C28,#082030);
  border-bottom:1px solid rgba(0,229,255,.2);
  padding:20px 16px;display:flex;justify-content:space-between;align-items:center}
.bal-lbl{font-size:10px;color:var(--tx2);letter-spacing:.8px;margin-bottom:3px;font-weight:600}
.bal-val{font-size:30px;font-weight:900;
  background:linear-gradient(135deg,#fff,var(--cy));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.bal-sub{font-size:11px;color:var(--tx3);margin-top:2px}
/* Stats grid */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 16px}
.sc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:14px;text-align:center;transition:.15s}
.sv{font-size:22px;font-weight:800;margin-bottom:3px}
.sl{font-size:10px;color:var(--tx2);letter-spacing:.5px;font-weight:600}
/* Badges */
.bx{padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bx-g{background:rgba(105,240,174,.12);color:var(--gr);border:1px solid rgba(105,240,174,.25)}
.bx-r{background:rgba(255,82,82,.12);color:var(--rd);border:1px solid rgba(255,82,82,.25)}
.bx-y{background:rgba(255,215,64,.12);color:var(--yw);border:1px solid rgba(255,215,64,.25)}
.bx-b{background:rgba(0,229,255,.1);color:var(--cy);border:1px solid rgba(0,229,255,.2)}
.bx-tl{background:var(--tla);color:var(--tl);border:1px solid rgba(0,191,165,.25)}
.bx-p{background:rgba(206,147,216,.12);color:var(--pu);border:1px solid rgba(206,147,216,.25)}
.bx-o{background:rgba(255,145,0,.12);color:var(--or);border:1px solid rgba(255,145,0,.25)}
/* Page */
.pg{padding:14px 16px}
.pt{font-size:20px;font-weight:900;margin-bottom:3px;
  background:linear-gradient(135deg,#fff,var(--cy));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent}
.ps{font-size:12px;color:var(--tx2);margin-bottom:16px}
/* Job cards */
.jc{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:15px;margin-bottom:10px;transition:.15s}
.jc:hover{border-color:rgba(0,229,255,.2)}
.jc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;gap:8px}
.jc-title{font-size:14px;font-weight:700;flex:1}
.jc-rate{font-size:21px;font-weight:900;color:var(--cy);line-height:1;white-space:nowrap}
.jc-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.jc-desc{font-size:12px;color:var(--tx2);line-height:1.55;margin-bottom:11px}
.jc-acts{display:flex;gap:8px}
.jc-acts .btn{flex:1}
/* Payout */
.pi{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);
  padding:13px 15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.pi-l h4{font-size:13px;font-weight:600}
.pi-l p{font-size:11px;color:var(--tx2);margin-top:2px}
.pi-r{text-align:right}
.pi-amt{font-size:18px;font-weight:800;color:var(--cy)}
/* List items */
.li{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.li h4{font-size:13px;font-weight:700;margin-bottom:3px}
.li p{font-size:11px;color:var(--tx2);line-height:1.5}
.li-acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
/* Worker rows */
.wr{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.wr-l h4{font-size:12px;font-weight:700}
.wr-l p{font-size:10px;color:var(--tx2);margin-top:1px}
.wr-r{display:flex;gap:6px;align-items:center;flex-shrink:0}
/* Toast */
.tc{position:fixed;top:calc(64px + env(safe-area-inset-top,0));right:12px;z-index:999;
  display:flex;flex-direction:column;gap:7px;pointer-events:none;max-width:290px}
.tst{background:var(--s1);border-left:3px solid var(--cy);border-radius:var(--r2);
  padding:11px 14px;font-size:12px;pointer-events:auto;line-height:1.4;
  animation:tsin .25s ease;box-shadow:0 4px 24px rgba(0,0,0,.7);color:var(--tx)}
.tst.err{border-color:var(--rd)}.tst.ok{border-color:var(--gr)}.tst.warn{border-color:var(--yw)}
@keyframes tsin{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
/* Modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:500;
  display:flex;align-items:flex-end;justify-content:center}
.mdl{background:var(--s1);border:1px solid var(--bd);border-top:2px solid var(--cy);
  border-radius:var(--r) var(--r) 0 0;padding:22px 20px;
  width:100%;max-width:500px;max-height:90vh;overflow-y:auto}
.mdl-t{font-size:17px;font-weight:800;margin-bottom:14px;color:var(--cy)}
.mdl-acts{display:flex;gap:9px;margin-top:14px}
.mdl-acts .btn{flex:1}
/* Notif panel */
.np{position:fixed;top:calc(60px + env(safe-area-inset-top,0));right:0;
  width:300px;max-height:72vh;background:var(--s1);
  border:1px solid var(--bd);border-radius:var(--r) 0 0 var(--r);
  overflow-y:auto;z-index:300;box-shadow:0 8px 40px rgba(0,0,0,.8)}
.ni{padding:11px 14px;border-bottom:1px solid var(--bd);font-size:12px;cursor:pointer;line-height:1.4}
.ni.unr{background:var(--cyd)}
.ni-t{font-size:10px;color:var(--tx3);margin-top:3px}
/* Divider */
.dv{height:1px;background:var(--bd);margin:14px 0}
/* Empty state */
.emp{text-align:center;padding:44px 16px;color:var(--tx2)}
.emp-i{font-size:36px;margin-bottom:10px}
/* Proof img */
.pimg{width:100%;max-height:200px;object-fit:cover;border-radius:var(--r2);margin:8px 0;border:1px solid var(--bd)}
/* Timer */
.tmr{font-family:monospace;font-size:16px;font-weight:700;color:var(--yw)}
.tmr.urg{color:var(--rd);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
/* Proof box */
.proof-drop{width:100%;height:140px;background:var(--s3);
  border:2px dashed var(--bd);border-radius:var(--r2);
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:6px;font-size:12px;color:var(--tx2);
  cursor:pointer;margin-bottom:10px;transition:.15s}
.proof-drop:hover{border-color:var(--cy);color:var(--cy)}
/* Section header */
.sec-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sec-t{font-size:14px;font-weight:700}
/* Leaderboard */
.lb-item{background:var(--s2);border:1px solid var(--bd);border-radius:var(--r2);
  padding:10px 13px;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.lb-rank{font-size:18px;width:28px;text-align:center;flex-shrink:0}
.lb-info{flex:1}
.lb-name{font-size:12px;font-weight:700}
.lb-earn{font-size:11px;color:var(--tx2)}
.lb-amt{font-size:14px;font-weight:800;color:var(--cy)}
/* Announcement */
.ann{background:linear-gradient(135deg,#041A28,#061E2F);
  border:1px solid rgba(0,229,255,.2);border-radius:var(--r);
  padding:13px 15px;margin-bottom:8px}
.ann-title{font-size:12px;font-weight:700;color:var(--cy);margin-bottom:4px}
.ann-body{font-size:12px;color:var(--tx2);line-height:1.5}
.ann-time{font-size:10px;color:var(--tx3);margin-top:4px}
/* Job type buttons */
.jtype-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.jtype-btn{background:var(--s3);border:2px solid var(--bd);border-radius:var(--r2);
  padding:14px 10px;text-align:center;cursor:pointer;transition:.2s;color:var(--tx)}
.jtype-btn:hover,.jtype-btn.sel{border-color:var(--cy);background:var(--cyd)}
.jtype-btn.sel .jt-ico{filter:drop-shadow(0 0 6px var(--cy))}
.jt-ico{font-size:24px;margin-bottom:6px}
.jt-lbl{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--cy)}
.jt-sub{font-size:10px;color:var(--tx2);margin-top:2px}
/* Progress */
.prog-wrap{background:var(--s3);border-radius:20px;height:6px;overflow:hidden;margin-top:6px}
.prog-bar{height:100%;border-radius:20px;background:linear-gradient(90deg,var(--cy),var(--tl));transition:.3s}
/* Charts - simple CSS bars */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,var(--cy),var(--tl));min-height:4px;transition:.5s}
.bar-lbl{font-size:9px;color:var(--tx3)}
/* Activity feed */
.af-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.af-dot{width:8px;height:8px;border-radius:50%;background:var(--cy);flex-shrink:0;margin-top:4px}
.af-dot.red{background:var(--rd)}.af-dot.green{background:var(--gr)}.af-dot.yellow{background:var(--yw)}
.af-text{font-size:12px;flex:1;line-height:1.4}
.af-time{font-size:10px;color:var(--tx3);margin-top:2px}
/* Search */
.search-wrap{position:relative;margin-bottom:12px}
.search-wrap .inp{padding-left:36px}
.search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px}
/* Format preview box */
.fmt-box{background:var(--s3);border:1px solid var(--bd);border-radius:var(--r2);
  padding:12px;margin-bottom:12px;font-size:11px;color:var(--tx2);line-height:1.7}
.fmt-box b{color:var(--cy)}
</style>
</head>
<body>
<div id="app"></div>
<div class="tc" id="tc"></div>
<script>
// ── OWNER CREDENTIALS (obfuscated char codes) ──
const _OA=[78,79,86,65,45,79,87,78,83,45,49,56,48,55];
const _OB=[78,79,86,65,45,79,87,78,83,45,49,56,49,48];
const _chkO=(a,b)=>a===String.fromCharCode(..._OA)&&b===String.fromCharCode(..._OB);

// ── DB ──
const DB={
  g:(k,d=null)=>{try{const v=localStorage.getItem(k);return v!==null?JSON.parse(v):d}catch{return d}},
  s:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch(e){console.warn('Storage full or blocked:',e);}},
  workers:()=>DB.g('ee_w',[]),
  sw:(w)=>DB.s('ee_w',w),
  jobs:()=>DB.g('ee_j',[]),
  sj:(j)=>DB.s('ee_j',j),
  subs:()=>DB.g('ee_s',[]),
  ss:(s)=>DB.s('ee_s',s),
  pays:()=>DB.g('ee_p',[]),
  sp:(p)=>DB.s('ee_p',p),
  agents:()=>DB.g('ee_a',[]),
  sa:(a)=>DB.s('ee_a',a),
  anns:()=>DB.g('ee_ann',[]),
  san:(a)=>DB.s('ee_ann',a),
  notifs:(uid)=>DB.g('ee_n_'+uid,[]),
  addN:(uid,msg,type='info')=>{
    const n=DB.notifs(uid);
    n.unshift({id:Date.now()+(Math.random()*99|0),msg,type,time:Date.now(),read:false});
    DB.s('ee_n_'+uid,n.slice(0,100));
  },
  markNRead:(uid)=>DB.s('ee_n_'+uid,DB.notifs(uid).map(x=>({...x,read:true})))
};

// ── STATE ──
let S={user:null,role:null,tab:'dash',modal:null,notifOpen:false,jobType:'mini',search:'',workerFilter:'all',workerSort:'earned'};
let _rt=null;

// ── UTILS ──
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fmt=(n)=>'₹'+Number(n||0).toFixed(2);
const fmtD=(ts)=>ts?new Date(ts).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'—';
const timeLeft=(dl)=>{
  const d=dl-Date.now();
  if(d<=0)return{s:'00:00',urgent:true,over:true};
  const m=Math.floor(d/60000),s=Math.floor((d%60000)/1000);
  return{s:`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`,urgent:d<300000,over:false};
};
const genId=(prefix,arr,field='id')=>{
  const nums=arr.map(x=>{const m=(x[field]||'').match(/(\d+)$/);return m?parseInt(m[1]):0});
  return `${prefix}${(Math.max(0,...nums)+1).toString().padStart(4,'0')}`;
};
const esc=(s='')=>String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;');

// ── SESSION ──
const saveSession=()=>{
  if(S.user&&S.role){
    sessionStorage.setItem('ee_sess',JSON.stringify({uid:S.user.id,role:S.role}));
  }
};
const restoreSession=()=>{
  try{
    const saved=sessionStorage.getItem('ee_sess');
    if(!saved)return;
    let parsed;
    try{parsed=JSON.parse(saved);}catch{sessionStorage.removeItem('ee_sess');return;}
    const{uid:savedUid,role}=parsed;
    if(!savedUid||!role){sessionStorage.removeItem('ee_sess');return;}
    if(role==='owner'){
      S.user={id:'OWNER',name:'OWNER'};S.role='owner';
    } else if(role==='worker'){
      let workers=[];
      try{workers=DB.workers();}catch{sessionStorage.removeItem('ee_sess');return;}
      const w=workers.find(x=>x.id===savedUid);
      if(w&&!w.blocked){
        S.user=w;S.role='worker';
      } else {
        // Worker deleted, blocked, or not found — clear session cleanly
        sessionStorage.removeItem('ee_sess');
      }
    } else {
      sessionStorage.removeItem('ee_sess');
    }
  }catch(e){
    // Any unexpected error: clear session, don't crash
    try{sessionStorage.removeItem('ee_sess');}catch{}
  }
};

// ── TOAST ──
const toast=(msg,type='info')=>{
  const tc=document.getElementById('tc');
  const d=document.createElement('div');
  d.className='tst '+(type==='error'?'err':type==='success'?'ok':type==='warn'?'warn':'');
  const ico=type==='error'?'❌':type==='success'?'✅':type==='warn'?'⚠️':'ℹ️';
  d.textContent=ico+' '+msg;tc.appendChild(d);
  setTimeout(()=>d.remove(),3800);
};

// ── IMAGE RESIZE ──
const resizeImg=(file,cb)=>{
  const r=new FileReader();
  r.onload=e=>{
    const img=new Image();
    img.onload=()=>{
      const c=document.createElement('canvas');
      const max=500;let w=img.width,h=img.height;
      if(w>max){h=h*max/w;w=max;}if(h>max){w=w*max/h;h=max;}
      c.width=w;c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',.65));
    };img.src=e.target.result;
  };r.readAsDataURL(file);
};

let _loginBusy=false;
window.workerLogin=()=>{
  if(_loginBusy)return; // prevent double-click
  const keyRaw=(document.getElementById('wk')?.value||'');
  const key=keyRaw.trim().toUpperCase().replace(/\s/g,'');
  const pass=(document.getElementById('wp')?.value||'').trim(); // trim accidental spaces
  const errEl=document.getElementById('lerr');
  const btn=document.querySelector('.lgn-box .btn-cy');
  const showErr=(msg)=>{
    if(errEl){errEl.textContent=msg;errEl.style.display='block';}
    _loginBusy=false;
    if(btn){btn.textContent='LOGIN →';btn.disabled=false;}
  };
  // Hide any old error first
  if(errEl)errEl.style.display='none';
  // Basic field checks
  if(!key){showErr('Please enter your Worker Key.');return;}
  if(!pass){showErr('Please enter your password.');return;}
  // Format check
  if(!key.startsWith('WORK-NOVA-')){
    showErr('Invalid key format. It should look like: WORK-NOVA-0001');return;
  }
  // Loading state
  _loginBusy=true;
  if(btn){btn.textContent='Verifying...';btn.disabled=true;}
  // Small delay for UX (feels responsive, avoids instant flash)
  setTimeout(()=>{
    let workers=[];
    try{workers=DB.workers();}catch(e){
      showErr('App data error. Please refresh the page.');return;
    }
    const w=workers.find(x=>x.id===key);
    if(!w){showErr('Worker ID not found. Check your key or contact admin.');return;}
    if(w.blocked){showErr('Your account has been blocked. Please contact admin.');return;}
    // Check both exact and trimmed password match
    if(w.password!==pass&&w.password.trim()!==pass){
      showErr('Incorrect password. Please try again.');return;
    }
    // Login success
    S.user=w;S.role='worker';S.tab='dash';
    _loginBusy=false;
    saveSession();
    toast('Welcome back, '+(w.name||w.id)+'! 👋','success');
    render();
  },300);
};

window.takeJob=(jid)=>{
  const w=S.user;
  if(DB.subs().find(x=>x.workerId===w.id&&x.status==='taken')){toast('Release your current job first!','error');return;}
  const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===jid);
  if(ji===-1||jobs[ji].slotsLeft<=0||(jobs[ji].expiry>0&&jobs[ji].expiry<Date.now())){toast('Job no longer available','error');return;}
  jobs[ji].slotsLeft--;DB.sj(jobs);
  const sub={id:uid(),jobId:jid,workerId:w.id,status:'taken',
    takenAt:Date.now(),deadline:Date.now()+30*60*1000,proof:null,submittedAt:null};
  const subs=DB.subs();subs.push(sub);DB.ss(subs);
  DB.addN(w.id,`Job taken: "${jobs[ji].title}". Submit proof within 30 minutes!`,'info');
  toast('Job taken! Submit proof within 30 min ✅','success');renderWorker();
};

window.releaseJob=(subId)=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);
  if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}
  subs.splice(si,1);DB.ss(subs);toast('Job released','info');renderWorker();
};

window.autoReleaseJob=(subId)=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);
  if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}
  subs.splice(si,1);DB.ss(subs);renderWorker();
};

window.agentWithdraw=(agId)=>{
  const ag=DB.agents().find(x=>x.id===agId);if(!ag)return;
  const total=DB.workers().filter(x=>ag.teamWorkers.includes(x.id)).reduce((a,x)=>a+x.balance,0);
  if(total<20){toast('Team balance must be at least ₹20','error');return;}
  const agWorker=DB.workers().find(x=>x.id===ag.workerId);
  if(!agWorker?.upiId){S.modal={type:'agentWithdraw',agentId:agId,total};renderWorker();return;}
  doAgentWithdraw(agId,agWorker.upiId,total);
};
window.doAgentWithdraw=(agId,upiId,amount)=>{
  const ag=DB.agents().find(x=>x.id===agId);if(!ag)return;
  const ws=DB.workers();
  ag.teamWorkers.forEach(wid=>{const wi=ws.findIndex(x=>x.id===wid);if(wi!==-1)ws[wi].balance=0;});
  DB.sw(ws);
  const pays=DB.pays();
  pays.push({id:'PAY-'+uid(),workerId:ag.workerId,amount,upiId,
    status:'pending',requestedAt:Date.now(),note:'Team withdrawal by agent',isAgentPay:true});
  DB.sp(pays);DB.addN(ag.workerId,`Team withdrawal of ${fmt(amount)} requested.`,'info');
  toast(`Team withdrawal of ${fmt(amount)} submitted!`,'success');S.modal=null;renderWorker();
};
window.agentBlock=(agId,wid)=>{
  const ws=DB.workers();const wi=ws.findIndex(x=>x.id===wid);

};

  const totalBal=all.reduce((a,x)=>a+(x.balance||0),0);
  const totalEarned=all.reduce((a,x)=>a+(x.totalEarned||0),0);
  const totalPaid=allPays.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0);
  const pendingPay=allPays.filter(x=>x.status==='pending').reduce((a,x)=>a+x.amount,0);
  const pendingProofs=allSubs.filter(x=>x.status==='pending').length;
  const todayStart=new Date();todayStart.setHours(0,0,0,0);
  const todayJobs=allSubs.filter(x=>x.submittedAt&&x.submittedAt>=todayStart.getTime()).length;
  const todayNew=all.filter(x=>x.joinedAt&&x.joinedAt>=todayStart.getTime()).length;

  // Filters & sort
  const q=(S.search||'').toLowerCase();
  const filt=S.workerFilter||'all';
  const sort=S.workerSort||'earned';
  let workers=all.filter(w=>{
    const mq=!q||w.id.toLowerCase().includes(q)||(w.name||'').toLowerCase().includes(q)||(w.email||'').toLowerCase().includes(q)||(w.phone||'').includes(q);
    const mf=filt==='all'||(filt==='active'&&!w.blocked)||(filt==='blocked'&&w.blocked)||(filt==='agent'&&allAgents.some(a=>a.workerId===w.id&&a.approved));
    return mq&&mf;
  });
  workers=[...workers].sort((a,b)=>{
    if(sort==='earned')return (b.totalEarned||0)-(a.totalEarned||0);
    if(sort==='balance')return (b.balance||0)-(a.balance||0);
    if(sort==='jobs')return (allSubs.filter(x=>x.workerId===b.id&&x.status==='approved').length)-(allSubs.filter(x=>x.workerId===a.id&&x.status==='approved').length);
    if(sort==='newest')return (b.joinedAt||0)-(a.joinedAt||0);
    if(sort==='name')return (a.name||a.id).localeCompare(b.name||b.id);
    return 0;
  });

  // Top 3 earners
  const top3=all.filter(x=>!x.blocked).sort((a,b)=>(b.totalEarned||0)-(a.totalEarned||0)).slice(0,3);
  const podiumIco=['🥇','🥈','🥉'];
  const podiumClr=['#F0C040','#C0C8D0','#CD7F32'];

  return `<div style="padding:0">

  <!-- PLATFORM OVERVIEW HEADER -->
  <div style="background:linear-gradient(135deg,#051C28,#071E30);border-bottom:1px solid rgba(0,229,255,.15);padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <div>
        <div style="font-size:18px;font-weight:900;background:linear-gradient(135deg,#fff,var(--cy));-webkit-background-clip:text;-webkit-text-fill-color:transparent">Worker Dashboard</div>
        <div style="font-size:11px;color:var(--tx2);margin-top:2px">${all.length} workers registered · ${todayNew>0?todayNew+' joined today':''}</div>
      </div>
      <button class="btn btn-cy btn-sm" style="width:auto;padding:9px 16px" onclick="showCreateWorker()">➕ New Worker</button>
    </div>

    <!-- 6-STAT GRID -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">
      ${[
        ['👥','Total Workers',all.length,'var(--cy)'],
        ['✅','Active',all.filter(x=>!x.blocked).length,'var(--gr)'],
        ['🚫','Blocked',all.filter(x=>x.blocked).length,'var(--rd)'],
        ['💰','Total Earned',fmt(totalEarned),'var(--cy)'],
        ['💳','Total Paid',fmt(totalPaid),'var(--gr)'],
        ['⏳','Pending Pay',fmt(pendingPay),'var(--yw)'],
      ].map(([ico,lbl,val,clr])=>`
        <div style="background:rgba(0,0,0,.3);border:1px solid rgba(0,229,255,.1);border-radius:10px;padding:10px 8px;text-align:center">
          <div style="font-size:16px;margin-bottom:3px">${ico}</div>
          <div style="font-size:15px;font-weight:800;color:${clr}">${val}</div>
          <div style="font-size:9px;color:var(--tx3);letter-spacing:.3px;margin-top:1px">${lbl}</div>
        </div>`).join('')}
    </div>

    <!-- TODAY QUICK STRIP -->
    <div style="display:flex;gap:8px;margin-top:10px">
      <div style="flex:1;background:rgba(0,229,255,.07);border:1px solid rgba(0,229,255,.15);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">📸</span>
        <div><div style="font-size:13px;font-weight:700;color:var(--cy)">${pendingProofs}</div><div style="font-size:10px;color:var(--tx3)">Pending Proofs</div></div>
      </div>
      <div style="flex:1;background:rgba(105,240,174,.07);border:1px solid rgba(105,240,174,.15);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">⚡</span>
        <div><div style="font-size:13px;font-weight:700;color:var(--gr)">${todayJobs}</div><div style="font-size:10px;color:var(--tx3)">Today's Submissions</div></div>
      </div>
      <div style="flex:1;background:rgba(255,215,64,.07);border:1px solid rgba(255,215,64,.15);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:8px">
        <span style="font-size:18px">🤝</span>
        <div><div style="font-size:13px;font-weight:700;color:var(--yw)">${allAgents.filter(x=>x.approved).length}</div><div style="font-size:10px;color:var(--tx3)">Active Agents</div></div>
      </div>
    </div>
  </div>

  <!-- TOP EARNERS PODIUM -->
  ${top3.length?`
  <div style="padding:14px 16px 0">
    <div style="font-size:12px;font-weight:700;color:var(--tx2);letter-spacing:.5px;margin-bottom:10px">🏆 TOP EARNERS</div>
    <div style="display:flex;gap:8px;overflow-x:auto;padding-bottom:4px">
      ${top3.map((w,i)=>{
        const ws=allSubs.filter(x=>x.workerId===w.id);
        const rate=ws.length>0?Math.round((ws.filter(x=>x.status==='approved').length/ws.length)*100):0;
        const isAg=allAgents.some(a=>a.workerId===w.id&&a.approved);
        return `<div style="flex:0 0 150px;background:linear-gradient(145deg,var(--s2),var(--s3));
          border:1px solid ${podiumClr[i]}44;border-radius:12px;padding:12px;text-align:center;cursor:pointer"
          onclick="ownerViewWorker('${w.id}')">
          <div style="font-size:24px;margin-bottom:4px">${podiumIco[i]}</div>
          <div style="width:38px;height:38px;border-radius:50%;
            background:linear-gradient(135deg,${podiumClr[i]},${podiumClr[i]}88);
            display:flex;align-items:center;justify-content:center;
            font-size:16px;font-weight:800;color:#001020;margin:0 auto 6px">${(w.name||w.id).charAt(0).toUpperCase()}</div>
          <div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.name||w.id)}</div>
          <div style="font-size:14px;font-weight:900;color:${podiumClr[i]};margin:4px 0">${fmt(w.totalEarned)}</div>
          <div style="font-size:10px;color:var(--tx2)">${ws.filter(x=>x.status==='approved').length} jobs · ${rate}% ✅</div>
          ${isAg?'<span class="bx bx-tl" style="font-size:9px;margin-top:4px;display:inline-flex">AGENT</span>':''}
        </div>`;
      }).join('')}
    </div>
  </div>`:''}

  <!-- SEARCH + FILTER + SORT -->
  <div style="padding:12px 16px;border-bottom:1px solid var(--bd)">
    <div class="search-wrap" style="margin-bottom:10px">
      <span class="search-icon">🔍</span>
      <input class="inp" placeholder="Search by name, ID, email, phone..." style="padding-left:36px"
        oninput="S.search=this.value;renderOwner()" value="${esc(S.search||'')}">
    </div>
    <!-- Filter tabs -->
    <div style="display:flex;gap:6px;margin-bottom:8px;overflow-x:auto">
      ${[['all','All','👥'],['active','Active','✅'],['blocked','Blocked','🚫'],['agent','Agents','🤝']].map(([v,l,i])=>
        `<button onclick="S.workerFilter='${v}';renderOwner()" style="flex:0 0 auto;padding:5px 11px;border-radius:20px;border:1px solid ${filt===v?'var(--cy)':'var(--bd)'};background:${filt===v?'rgba(0,229,255,.12)':'transparent'};color:${filt===v?'var(--cy)':'var(--tx2)'};font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap">${i} ${l}</button>`
      ).join('')}
      <div style="flex:1"></div>
      <select style="padding:5px 8px;border-radius:8px;border:1px solid var(--bd);background:var(--s3);color:var(--tx2);font-size:11px;font-weight:700;cursor:pointer;flex:0 0 auto"
        onchange="S.workerSort=this.value;renderOwner()">
        <option value="earned" ${sort==='earned'?'selected':''}>Sort: Earnings</option>
        <option value="balance" ${sort==='balance'?'selected':''}>Sort: Balance</option>
        <option value="jobs" ${sort==='jobs'?'selected':''}>Sort: Jobs</option>
        <option value="newest" ${sort==='newest'?'selected':''}>Sort: Newest</option>
        <option value="name" ${sort==='name'?'selected':''}>Sort: Name A–Z</option>
      </select>
    </div>
    <div style="font-size:11px;color:var(--tx3)">${workers.length} worker${workers.length!==1?'s':''} shown</div>
  </div>

  <!-- WORKER CARDS -->
  <div style="padding:12px 16px">
  ${workers.length===0?`<div class="emp"><div class="emp-i">👥</div>${all.length?'No workers match your search':'No workers yet. Create one above!'}</div>`:
  workers.map(w=>{
    const ws=allSubs.filter(x=>x.workerId===w.id);
    const done=ws.filter(x=>x.status==='approved').length;
    const fail=ws.filter(x=>x.status==='rejected').length;
    const pend=ws.filter(x=>x.status==='pending').length;
    const total=ws.length;
    const rate=total>0?Math.round((done/total)*100):0;
    const isAg=allAgents.some(a=>a.workerId===w.id&&a.approved);
    const agReq=allAgents.some(a=>a.workerId===w.id&&!a.approved);
    const initials=(w.name||w.id).slice(0,2).toUpperCase();
    const avgEarn=all.length>0?(totalEarned/all.length):0;
    const earnPct=avgEarn>0?Math.min(100,Math.round(((w.totalEarned||0)/avgEarn)*50)):0;
    const wPays=allPays.filter(x=>x.workerId===w.id);
    return `
    <div style="background:var(--s2);border:1px solid ${w.blocked?'rgba(255,82,82,.25)':isAg?'rgba(0,191,165,.25)':'var(--bd)'};
      border-radius:14px;padding:0;margin-bottom:10px;overflow:hidden;transition:.15s">

      <!-- Card top: avatar + name + badges + status -->
      <div style="padding:13px 14px 10px;display:flex;align-items:flex-start;gap:12px">
        <div style="flex-shrink:0">
          <div style="width:44px;height:44px;border-radius:50%;
            background:linear-gradient(135deg,var(--cy),var(--tl));
            display:flex;align-items:center;justify-content:center;
            font-size:16px;font-weight:900;color:#001020;
            box-shadow:0 0 12px rgba(0,229,255,.3)">${initials}</div>
        </div>
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:3px">
            <span style="font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(w.name||w.id)}</span>
            <span class="bx ${w.blocked?'bx-r':'bx-g'}" style="font-size:9px">${w.blocked?'🚫 BLOCKED':'🟢 ACTIVE'}</span>
            ${isAg?'<span class="bx bx-tl" style="font-size:9px">🤝 AGENT</span>':''}
            ${agReq?'<span class="bx bx-y" style="font-size:9px">⏳ AGENT REQ</span>':''}
          </div>
          <div style="font-size:11px;color:var(--cy);font-weight:600;margin-bottom:2px">${esc(w.id)}</div>
          <div style="font-size:10px;color:var(--tx3)">${w.email?esc(w.email)+' · ':''} ${w.phone?esc(w.phone)+' · ':''}Joined ${fmtD(w.joinedAt)}</div>
        </div>
      </div>

      <!-- Earnings row -->
      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1px solid var(--bd);border-bottom:1px solid var(--bd)">
        ${[['💰 Balance',fmt(w.balance),'var(--cy)'],['📈 Earned',fmt(w.totalEarned),'var(--gr)'],['📊 Withdrawn',fmt(wPays.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0)),'var(--yw)']].map(([l,v,c])=>
          `<div style="padding:10px 8px;text-align:center;${l!=='💰 Balance'?'border-left:1px solid var(--bd)':''}">
            <div style="font-size:13px;font-weight:800;color:${c}">${v}</div>
            <div style="font-size:9px;color:var(--tx3);margin-top:2px">${l}</div>
          </div>`).join('')}
      </div>

      <!-- Jobs + success rate -->
      <div style="padding:10px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <div style="font-size:11px;color:var(--tx2)">
            ✅ <b style="color:var(--gr)">${done}</b> &nbsp;❌ <b style="color:var(--rd)">${fail}</b> &nbsp;⏳ <b style="color:var(--yw)">${pend}</b> &nbsp;📋 Total: <b>${total}</b>
          </div>
          <div style="font-size:11px;font-weight:700;color:${rate>=70?'var(--gr)':rate>=40?'var(--yw)':'var(--rd)'}">${rate}% success</div>
        </div>
        <!-- Success rate bar -->
        <div class="prog-wrap">
          <div class="prog-bar" style="width:${rate}%;background:linear-gradient(90deg,${rate>=70?'var(--gr)':rate>=40?'var(--yw)':'var(--rd)'},${rate>=70?'#00A04A':rate>=40?'#CC8800':'#CC0033'})"></div>
        </div>
        <!-- Earnings vs avg bar -->
        <div style="margin-top:6px;font-size:10px;color:var(--tx3);display:flex;justify-content:space-between">
          <span>Earnings vs avg</span>
          <span style="color:${earnPct>=50?'var(--gr)':earnPct>=25?'var(--yw)':'var(--tx3)'}">${earnPct>=50?'Above avg':'Below avg'}</span>
        </div>
        <div class="prog-wrap" style="height:4px">
          <div class="prog-bar" style="width:${Math.min(100,earnPct*2)}%;background:linear-gradient(90deg,var(--tl),var(--cy))"></div>
        </div>
        ${w.upiId?`<div style="font-size:10px;color:var(--tx3);margin-top:6px">💳 UPI: ${esc(w.upiId)}</div>`:''}
      </div>

      <!-- Action buttons -->
      <div style="padding:0 14px 13px;display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-xs btn-outline btn" style="flex:1;min-width:0;justify-content:center" onclick="ownerViewWorker('${w.id}')">👁 View</button>
        <button class="btn btn-xs ${w.blocked?'btn-success':'btn-danger'} btn" style="flex:1;min-width:0;justify-content:center" onclick="ownerBlock('${w.id}')">${w.blocked?'✅ Unblock':'🚫 Block'}</button>
        <button class="btn btn-xs btn-outline btn" style="flex:1;min-width:0;justify-content:center" onclick="ownerAdjBal('${w.id}')">₹ Adjust</button>
        <button class="btn btn-xs btn-outline btn" style="flex:1;min-width:0;justify-content:center" onclick="ownerResetPass('${w.id}')">🔑 Reset</button>
        <button class="btn btn-xs btn-danger btn" style="flex:1;min-width:0;justify-content:center" onclick="confirmDeleteWorker('${w.id}')">🗑</button>
      </div>
    </div>`;
  }).join('')}
  </div>
  </div>`;
};

// Worker detail view
window.ownerViewWorker=(wid)=>{S.modal={type:'workerDetail',wid};renderOwner();};

const renderWorkerDetail=(wid)=>{
  const w=DB.workers().find(x=>x.id===wid);if(!w)return'<div class="mdl-t">Not found</div>';
  const ws=DB.subs().filter(x=>x.workerId===wid);
  const pays=DB.pays().filter(x=>x.workerId===wid);
  const done=ws.filter(x=>x.status==='approved');
  const fail=ws.filter(x=>x.status==='rejected').length;
  const pend=ws.filter(x=>x.status==='pending').length;
  const rate=ws.length>0?Math.round((done.length/ws.length)*100):0;
  const paidTotal=pays.filter(x=>x.status==='paid').reduce((a,x)=>a+x.amount,0);
  const pendPay=pays.filter(x=>x.status==='pending').reduce((a,x)=>a+x.amount,0);
  const ag=DB.agents().find(x=>x.workerId===wid&&x.approved);

  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const today=new Date();
  const weekData=Array(7).fill(0);
  done.forEach(s=>{
    const d=new Date(s.submittedAt||s.takenAt);
    const diff=Math.floor((today-d)/86400000);
    if(diff>=0&&diff<7){
      const j=DB.jobs().find(x=>x.id===s.jobId);
      weekData[6-diff]+=j?.rate||0;
    }
  });
  const maxW=Math.max(...weekData,1);

  return `
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px">
    <div style="width:52px;height:52px;border-radius:50%;flex-shrink:0;
      background:linear-gradient(135deg,var(--cy),var(--tl));
      display:flex;align-items:center;justify-content:center;
      font-size:20px;font-weight:900;color:#001020">${(w.name||w.id).slice(0,2).toUpperCase()}</div>
    <div>
      <div class="mdl-t" style="margin-bottom:2px">${esc(w.name||w.id)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <span class="bx bx-b" style="font-size:9px">${esc(w.id)}</span>
        <span class="bx ${w.blocked?'bx-r':'bx-g'}" style="font-size:9px">${w.blocked?'BLOCKED':'ACTIVE'}</span>
        ${ag?`<span class="bx bx-tl" style="font-size:9px">AGENT ${esc(ag.agentId)}</span>`:''}
      </div>
    </div>
  </div>

  <!-- Profile info -->
  <div style="background:var(--s3);border-radius:var(--r2);padding:12px;margin-bottom:12px;font-size:12px">
    ${[['👤 Username',w.username||'—'],['📧 Email',w.email||'—'],['📱 Phone',w.phone||'—'],['💳 UPI',w.upiId||'Not set'],['📅 Joined',fmtD(w.joinedAt)]].map(([l,v])=>
      `<div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--bd)">
        <span style="color:var(--tx2)">${l}</span><span style="font-weight:600">${esc(String(v))}</span>
      </div>`).join('')}
  </div>

  <!-- Financial summary -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
    ${[['💰 Balance',fmt(w.balance),'var(--cy)'],['📈 Total Earned',fmt(w.totalEarned),'var(--gr)'],['✅ Paid Out',fmt(paidTotal),'var(--tl)'],['⏳ Pending Pay',fmt(pendPay),'var(--yw)']].map(([l,v,c])=>
      `<div style="background:var(--s3);border-radius:var(--r2);padding:11px;text-align:center">
        <div style="font-size:16px;font-weight:800;color:${c}">${v}</div>
        <div style="font-size:10px;color:var(--tx3);margin-top:2px">${l}</div>
      </div>`).join('')}
  </div>

  <!-- Job stats -->
  <div style="background:var(--s3);border-radius:var(--r2);padding:12px;margin-bottom:12px">
    <div style="font-size:11px;font-weight:700;color:var(--cy);margin-bottom:8px">📊 JOB PERFORMANCE</div>
    <div style="display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px">
      <span style="color:var(--tx2)">Success Rate</span>
      <span style="font-weight:700;color:${rate>=70?'var(--gr)':rate>=40?'var(--yw)':'var(--rd)'}">${rate}%</span>
    </div>
    <div class="prog-wrap" style="margin-bottom:10px">
      <div class="prog-bar" style="width:${rate}%;background:${rate>=70?'var(--gr)':rate>=40?'var(--yw)':'var(--rd)'}"></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px;text-align:center">
      ${[['Total',ws.length,'var(--tx)'],['✅ Done',done.length,'var(--gr)'],['❌ Fail',fail,'var(--rd)'],['⏳ Pend',pend,'var(--yw)']].map(([l,v,c])=>
        `<div><div style="font-size:18px;font-weight:800;color:${c}">${v}</div><div style="font-size:10px;color:var(--tx3)">${l}</div></div>`).join('')}
    </div>
  </div>

  <!-- Weekly earnings mini chart -->
  <div style="background:var(--s3);border-radius:var(--r2);padding:12px;margin-bottom:12px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <div style="font-size:11px;font-weight:700;color:var(--cy)">📈 LAST 7 DAYS EARNINGS</div>
      <div style="font-size:11px;color:var(--tx2)">${fmt(weekData.reduce((a,x)=>a+x,0))}</div>
    </div>
    <div class="bar-chart">
      ${weekData.map((v,i)=>`<div class="bar-col">
        <div class="bar" style="height:${Math.round((v/maxW)*60)+4}px"></div>
        <div class="bar-lbl">${days[i]}</div>
      </div>`).join('')}
    </div>
  </div>

  <!-- Recent jobs -->
  <div style="font-size:11px;font-weight:700;color:var(--cy);margin-bottom:8px">RECENT JOBS</div>
  ${ws.length===0?'<div style="font-size:12px;color:var(--tx3);text-align:center;padding:12px">No jobs yet</div>':
  ws.slice(-5).reverse().map(s=>{
    const j=DB.jobs().find(x=>x.id===s.jobId)||{title:'Unknown',rate:0};
    return `<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:11px">
      <div><div style="font-weight:600">${esc(j.title)}</div><div style="color:var(--tx3)">${fmtD(s.submittedAt||s.takenAt)}</div></div>
      <div style="text-align:right"><div style="color:var(--cy);font-weight:700">${fmt(j.rate)}</div>
      <span class="bx ${s.status==='approved'?'bx-g':s.status==='rejected'?'bx-r':'bx-y'}" style="font-size:9px">${s.status.toUpperCase()}</span></div>
    </div>`;
  }).join('')}

window.createJob=()=>{
  const t=S.jobType||'mini';
  const title=(document.getElementById('jt_')?.value||'').trim();
  const desc=(document.getElementById('jd_')?.value||'').trim();
  const tut=(document.getElementById('jtu_')?.value||'').trim();
  const com=(document.getElementById('jco_')?.value||'').trim();
  const rate=parseFloat(document.getElementById('jr_')?.value);
  const slots=parseInt(document.getElementById('js_')?.value);
  const expMin=parseInt(document.getElementById('je_')?.value)||0;
  if(!title){toast('Job title required','error');return;}
  if(!desc){toast('Description required','error');return;}
  if(!rate||rate<=0){toast('Enter valid rate','error');return;}
  if(!slots||slots<=0){toast('Enter valid slots','error');return;}
  const job={id:'JOB-'+uid(),title,description:desc,tutorial:tut,comment:com,
    rate,slots,slotsLeft:slots,expiry:expMin>0?Date.now()+expMin*60*1000:0,
    active:true,createdAt:Date.now(),jobType:t};
  if(t==='app'){
    job.appName=document.getElementById('appName')?.value||'';
    job.appStore=document.getElementById('appStore')?.value||'';
    job.appLink=document.getElementById('appLink')?.value||'';
    job.appRating=document.getElementById('appRating')?.value||'5';
    job.appMinWords=document.getElementById('appMinW')?.value||'30';
    job.appScreenshot=document.getElementById('appSS')?.value==='yes';
  } else if(t==='map'){
    job.mapBusiness=document.getElementById('mapBiz')?.value||'';
    job.mapLink=document.getElementById('mapLink')?.value||'';
    job.mapLocation=document.getElementById('mapLoc')?.value||'';
    job.mapRating=document.getElementById('mapRating')?.value||'5';
    job.mapMinWords=document.getElementById('mapMinW')?.value||'15';
    job.mapScreenshot=document.getElementById('mapSS')?.value==='yes';
  } else if(t==='kyc'){
    job.kycPlatform=document.getElementById('kycPlat')?.value||'';
    job.kycType=document.getElementById('kycType')?.value||'';
    job.kycDocs=document.getElementById('kycDocs')?.value||'';
    job.kycSteps=document.getElementById('kycSteps')?.value||'';
  }
  const jobs=DB.jobs();jobs.push(job);DB.sj(jobs);
  DB.workers().forEach(w=>DB.addN(w.id,`🆕 New job: "${title}" — ${fmt(rate)}. Available now!`,'info'));
  toast('Job published ✅ All workers notified!','success');
  renderOwner();
};

window.processPay=(pid,status)=>{
  const pays=DB.pays();const pi=pays.findIndex(x=>x.id===pid);if(pi===-1)return;
  const p=pays[pi];pays[pi].status=status;pays[pi].processedAt=Date.now();
  if(status==='paid'){
    DB.addN(p.workerId,`✅ Payment of ${fmt(p.amount)} has been PAID to ${p.upiId}! 🎉`,'info');
  } else if(status==='returned'){
    // Refund balance to worker
    const ws=DB.workers();const wi=ws.findIndex(x=>x.id===p.workerId);
    if(wi!==-1){ws[wi].balance=parseFloat((ws[wi].balance+p.amount).toFixed(2));DB.sw(ws);}
    pays[pi].note='Payment returned — balance refunded';
    DB.addN(p.workerId,`↩️ Payment of ${fmt(p.amount)} was returned. Balance refunded to your account.`,'info');
  } else if(status==='rejected'){
    const ws=DB.workers();const wi=ws.findIndex(x=>x.id===p.workerId);
    if(wi!==-1){ws[wi].balance=parseFloat((ws[wi].balance+p.amount).toFixed(2));DB.sw(ws);}
    pays[pi].note='Payment rejected — balance refunded';
    DB.addN(p.workerId,`❌ Payment of ${fmt(p.amount)} rejected. Balance refunded.`,'info');
  }
  DB.sp(pays);toast('Payment updated ✅','success');renderOwner();
};

window.viewProof=(src)=>{

window.reviewProof=(subId,status,reason='')=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const j=DB.jobs().find(x=>x.id===s.jobId)||{rate:0,title:'Job'};
  subs[si].status=status;subs[si].reviewedAt=Date.now();subs[si].rejectReason=reason;
  DB.ss(subs);
  if(status==='approved'){
    const ws=DB.workers();const wi=ws.findIndex(x=>x.id===s.workerId);
    if(wi!==-1){
      ws[wi].balance=parseFloat(((ws[wi].balance||0)+j.rate).toFixed(2));
      ws[wi].totalEarned=parseFloat(((ws[wi].totalEarned||0)+j.rate).toFixed(2));
      DB.sw(ws);
    }
    DB.addN(s.workerId,`✅ Job "${j.title}" APPROVED! ${fmt(j.rate)} credited to your balance. 💰`,'info');
  } else {
    const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);
    if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}
    DB.addN(s.workerId,`❌ Job "${j.title}" rejected.${reason?' Reason: '+reason:''}`,'info');
  }
  toast(`Proof ${status} ✅`,'success');renderOwner();
};
window.rejectProofPr=(subId)=>{
  const r=prompt('Enter rejection reason (optional):');
  reviewProof(subId,'rejected',r||'');
};

      <input id="nwid" class="inp" value="${nextId}" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase().replace(/\\s/g,'')"></div>
    <div class="ig"><label class="il">Full Name *</label><input id="nwname" class="inp" placeholder="Worker's full name"></div>
    <div class="ig"><label class="il">Username</label><input id="nwuser" class="inp" placeholder="@username"></div>
    <div class="ig"><label class="il">Email</label><input id="nwemail" class="inp" type="email" placeholder="email@example.com"></div>
    <div class="ig"><label class="il">Phone</label><input id="nwphone" class="inp" placeholder="Mobile number"></div>
    <div class="ig"><label class="il">Password *</label>
      <div class="inp-wrap"><input id="nwpass" class="inp" placeholder="Set account password">
      <button class="inp-eye" onclick="togglePw('nwpass',this)" tabindex="-1">👁</button></div></div>
    <div style="background:var(--s3);border-radius:var(--r2);padding:12px;font-size:12px;margin-bottom:4px;color:var(--tx2)">
      Worker ID: <b style="color:var(--cy)">${nextId}</b> · Share this key with the worker
    </div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-cy" onclick="createWorker()">Create ✅</button>
    </div>`;
  } else if(m.type==='adjustBal'){
    const w=DB.workers().find(x=>x.id===m.wid)||{};
    c=`<div class="mdl-t">₹ Adjust Balance — ${esc(w.name||m.wid)}</div>
    <div style="font-size:12px;color:var(--tx2);margin-bottom:12px">Current balance: <b style="color:var(--cy)">${fmt(w.balance)}</b></div>
    <div class="ig"><label class="il">Amount (positive = add, negative = deduct)</label>
      <input id="balAdj" class="inp" type="number" placeholder="e.g. 100 or -50"></div>
    <div class="ig"><label class="il">Reason</label><input id="balR" class="inp" placeholder="Bonus / Penalty / Correction..."></div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-cy" onclick="doAdjBal('${m.wid}')">Apply</button>
    </div>`;
  } else if(m.type==='resetPass'){
    const w=DB.workers().find(x=>x.id===m.wid)||{};
    c=`<div class="mdl-t">🔑 Reset Password — ${esc(w.name||m.wid)}</div>
    <div class="ig"><label class="il">New Password</label>
      <input id="newPW" class="inp" placeholder="Set new password"></div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-cy" onclick="doResetPass('${m.wid}')">Reset</button>
    </div>`;
  } else if(m.type==='deleteWorker'){
    const w=DB.workers().find(x=>x.id===m.wid)||{name:m.wid};
    c=`<div class="mdl-t">🗑 Delete Worker</div>
    <div style="font-size:13px;margin-bottom:14px;">Are you sure you want to permanently delete <b style="color:var(--cy)">${esc(w.name||m.wid)}</b> (${esc(m.wid)})?<br><br>
    <span style="color:var(--rd);font-size:12px">⚠️ This will delete the worker and all their data permanently. This cannot be undone.</span></div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-danger" onclick="deleteWorker('${m.wid}')">🗑 Delete Permanently</button>
    </div>`;
  } else if(m.type==='createAgent'){
    const nextId=genId('AGENT-NOVA-',DB.agents().filter(x=>x.agentId),'agentId');
    c=`<div class="mdl-t">🤝 Create Agent</div>
    <div class="ig"><label class="il">Worker ID</label>
      <input id="agWid" class="inp" placeholder="WORK-NOVA-0001" oninput="this.value=this.value.toUpperCase().replace(/\\s/g,'')" style="text-transform:uppercase"></div>
    <div class="ig"><label class="il">Agent ID (auto)</label>
      <input id="agId" class="inp" value="${nextId}" style="text-transform:uppercase" oninput="this.value=this.value.toUpperCase().replace(/\\s/g,'')"></div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-cy" onclick="createAgent()">Create Agent ✅</button>
    </div>`;
  } else if(m.type==='workerDetail'){
    c=renderWorkerDetail(m.wid);
  } else if(m.type==='ann'){
    c=`<div class="mdl-t">📢 Post Announcement</div>
    <div class="ig"><label class="il">Title</label><input id="annT" class="inp" placeholder="Announcement title"></div>
    <div class="ig"><label class="il">Message</label><textarea id="annB" class="inp" placeholder="Write your message to all workers..."></textarea></div>
    <div class="mdl-acts">
      <button class="btn btn-outline" onclick="closeOModal()">Cancel</button>
      <button class="btn btn-cy" onclick="postAnn()">📢 Post to All Workers</button>
    </div>`;
  }
  return `<div class="ov" onclick="closeOModalOuter(event)"><div class="mdl">${c}</div></div>`;
};
window.closeOModal=()=>{S.modal=null;renderOwner();};
window.closeOModalOuter=(e)=>{if(e.target.classList.contains('ov'))closeOModal();};

window.createWorker=()=>{
  const id=(document.getElementById('nwid')?.value||'').trim().toUpperCase();
  const name=(document.getElementById('nwname')?.value||'').trim();
  const username=(document.getElementById('nwuser')?.value||'').trim();
  const email=(document.getElementById('nwemail')?.value||'').trim();
  const phone=(document.getElementById('nwphone')?.value||'').trim();
  const pass=(document.getElementById('nwpass')?.value||'');
  if(!id||!name||!pass){toast('ID, Name and Password are required','error');return;}
  if(!id.startsWith('WORK-NOVA-')){toast('ID must start with WORK-NOVA-','error');return;}
  const ws=DB.workers();
  if(ws.find(x=>x.id===id)){toast('Worker ID already exists','error');return;}
  ws.push({id,name,username,email,phone,password:pass,
    balance:0,totalEarned:0,blocked:false,upiId:'',joinedAt:Date.now()});
  DB.sw(ws);toast(`✅ Worker ${id} created successfully!`,'success');S.modal=null;renderOwner();
};

window.doAdjBal=(wid)=>{
  const adj=parseFloat(document.getElementById('balAdj')?.value);
  const reason=(document.getElementById('balR')?.value||'').trim();
  if(isNaN(adj)){toast('Enter valid amount','error');return;}
  const ws=DB.workers();const wi=ws.findIndex(x=>x.id===wid);if(wi===-1)return;
  ws[wi].balance=parseFloat(Math.max(0,ws[wi].balance+adj).toFixed(2));
  if(adj>0)ws[wi].totalEarned=parseFloat((ws[wi].totalEarned+adj).toFixed(2));
  DB.sw(ws);
  DB.addN(wid,`Balance ${adj>=0?'increased by':'decreased by'} ${fmt(Math.abs(adj))}.${reason?' Reason: '+reason:''}`,'info');
  toast('Balance adjusted ✅','success');S.modal=null;renderOwner();
};

window.doResetPass=(wid)=>{
  const np=(document.getElementById('newPW')?.value||'');
  if(!np){toast('Enter new password','error');return;}
  const ws=DB.workers();const wi=ws.findIndex(x=>x.id===wid);if(wi===-1)return;
  ws[wi].password=np;DB.sw(ws);
  DB.addN(wid,'Your password has been reset by admin. Please login with your new password.','info');
  toast('Password reset ✅','success');S.modal=null;renderOwner();
};

window.deleteWorker=(wid)=>{
  // Remove worker
  DB.sw(DB.workers().filter(x=>x.id!==wid));
  // Remove submissions
  DB.ss(DB.subs().filter(x=>x.workerId!==wid));
  // Remove payouts
  DB.sp(DB.pays().filter(x=>x.workerId!==wid));
  // Remove from agent teams
  const ags=DB.agents();
  ags.forEach(ag=>{ag.teamWorkers=ag.teamWorkers.filter(x=>x!==wid);});
  DB.sa(ags.filter(x=>x.workerId!==wid));
  // Remove notifications
  localStorage.removeItem('ee_n_'+wid);
  toast('Worker deleted permanently','success');S.modal=null;renderOwner();
};

window.createAgent=()=>{
  const wid=(document.getElementById('agWid')?.value||'').trim().toUpperCase();
  const agId=(document.getElementById('agId')?.value||'').trim().toUpperCase();
  if(!wid||!agId){toast('All fields required','error');return;}
  if(!DB.workers().find(x=>x.id===wid)){toast('Worker not found','error');return;}
  const ags=DB.agents();const ai=ags.findIndex(x=>x.workerId===wid);
  if(ai!==-1){ags[ai].approved=true;ags[ai].agentId=agId;DB.sa(ags);}
  else{ags.push({id:uid(),agentId:agId,workerId:wid,approved:true,teamWorkers:[],createdAt:Date.now()});DB.sa(ags);}
  DB.addN(wid,`✅ Agent access granted! Your Agent ID: ${agId}. Start managing your team!`,'info');
  toast(`Agent created! ID: ${agId}`,'success');S.modal=null;renderOwner();
};

window.postAnn=()=>{
  const t=(document.getElementById('annT')?.value||'').trim();
  const b=(document.getElementById('annB')?.value||'').trim();
  if(!t||!b){toast('Fill title and message','error');return;}
  const anns=DB.anns();
  anns.unshift({id:uid(),title:t,body:b,time:Date.now()});
  DB.san(anns.slice(0,20));
  DB.workers().forEach(w=>DB.addN(w.id,`📢 Admin Announcement: ${t}`,'info'));
  toast('Announcement posted to all workers ✅','success');S.modal=null;renderOwner();
};

// ── INIT ──
restoreSession();
render();

// Auto-expire jobs every 30s
setInterval(()=>{
  const jobs=DB.jobs();let changed=false;
  jobs.forEach(j=>{if(j.expiry>0&&j.expiry<Date.now()&&j.active){j.active=false;changed=true;}});
  if(changed)DB.sj(jobs);
},30000);
</script>
</body>
</html>
