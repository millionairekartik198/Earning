<script>
// ── OWNER CREDENTIALS (obfuscated) ──
const _OA=[78,79,86,65,45,79,87,78,83,45,49,56,48,55];
const _OB=[78,79,86,65,45,79,87,78,83,45,49,56,49,48];
const _chkO=(a,b)=>a===String.fromCharCode(..._OA)&&b===String.fromCharCode(..._OB);

// ══════════════════════════════════════════════════
// FIREBASE SYNC ENGINE
// Single shared Firebase Realtime DB = source of truth for ALL devices.
// ══════════════════════════════════════════════════
const getSyncUrl=()=>(localStorage.getItem('ee_sync_url')||'').trim().replace(/\/+$/,'');
const setSyncUrl=(u)=>localStorage.setItem('ee_sync_url',u.trim().replace(/\/+$/,''));

// In-memory cache
// regs = self-registration requests (pending/approved/rejected)
let C={workers:[],jobs:[],subs:[],pays:[],agents:[],anns:[],notifs:{},regs:[],_ts:0,loaded:false};

const saveLocal=()=>{
  try{localStorage.setItem('ee_cache',JSON.stringify({
    workers:C.workers,jobs:C.jobs,subs:C.subs,pays:C.pays,
    agents:C.agents,anns:C.anns,notifs:C.notifs,regs:C.regs,_ts:C._ts
  }));}catch(e){}
};
const loadLocal=()=>{
  try{
    const d=JSON.parse(localStorage.getItem('ee_cache')||'null');
    if(!d){C.loaded=true;return;}
    C.workers=Array.isArray(d.workers)?d.workers:[];
    C.jobs=Array.isArray(d.jobs)?d.jobs:[];
    C.subs=Array.isArray(d.subs)?d.subs:[];
    C.pays=Array.isArray(d.pays)?d.pays:[];
    C.agents=Array.isArray(d.agents)?d.agents:[];
    C.anns=Array.isArray(d.anns)?d.anns:[];
    C.notifs=(d.notifs&&typeof d.notifs==='object')?d.notifs:{};
    C.regs=Array.isArray(d.regs)?d.regs:[];
    C._ts=d._ts||0;
  }catch(e){}
  C.loaded=true;
};

let _syncSt='off';let _lastSync=0;
let _writeQueue=Promise.resolve();

const _applySnapshot=(d)=>{
  if(!d||typeof d!=='object')return;
  if(Array.isArray(d.workers)) C.workers=d.workers;
  if(Array.isArray(d.jobs))    C.jobs=d.jobs;
  if(Array.isArray(d.subs))    C.subs=d.subs;
  if(Array.isArray(d.pays))    C.pays=d.pays;
  if(Array.isArray(d.agents))  C.agents=d.agents;
  if(Array.isArray(d.anns))    C.anns=d.anns;
  if(Array.isArray(d.regs))    C.regs=d.regs;
  if(d.notifs&&typeof d.notifs==='object') C.notifs=d.notifs;
  C._ts=d._ts||Date.now();
  C.loaded=true;
  saveLocal();
};

const forceSyncDown=async()=>{
  const url=getSyncUrl();
  if(!url){loadLocal();return;}
  const r=await fetch(url+'/elite-earner.json?auth=&t='+Date.now());
  if(!r.ok)throw new Error('HTTP '+r.status);
  const d=await r.json();
  _applySnapshot(d);
  _syncSt='ok';_lastSync=Date.now();
};

let _syncDownPromise=null;
const syncDown=async(rerender=true)=>{
  if(_syncDownPromise){await _syncDownPromise;if(rerender)render();return;}
  const url=getSyncUrl();
  if(!url){if(!C.loaded)loadLocal();if(rerender)render();return;}
  _syncSt='sync';
  _syncDownPromise=(async()=>{
    try{
      const r=await fetch(url+'/elite-earner.json?auth=&t='+Date.now());
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      _applySnapshot(d);
      _syncSt='ok';_lastSync=Date.now();
    }catch(e){_syncSt='err';if(!C.loaded)loadLocal();}
    _syncDownPromise=null;
  })();
  await _syncDownPromise;
  if(rerender)render();
};

const syncUp=()=>{
  saveLocal();
  const url=getSyncUrl();if(!url)return Promise.resolve();
  C._ts=Date.now();
  const payload=JSON.stringify({
    workers:C.workers,jobs:C.jobs,subs:C.subs,pays:C.pays,
    agents:C.agents,anns:C.anns,notifs:C.notifs,regs:C.regs,_ts:C._ts
  });
  _writeQueue=_writeQueue.then(async()=>{
    try{
      _syncSt='sync';
      const r=await fetch(url+'/elite-earner.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:payload});
      if(r.ok){_syncSt='ok';_lastSync=Date.now();saveLocal();}
      else _syncSt='err';
    }catch{_syncSt='err';}
  });
  return _writeQueue;
};

// ── AUTO-GENERATE WORKER ID (no duplicates across workers + regs) ──
const generateWorkerId=()=>{
  const allIds=[...C.workers.map(x=>x.id),...C.regs.map(x=>x.workerId)].filter(Boolean);
  const nums=allIds.map(id=>{const m=(id||'').match(/WORK-NOVA-(\d+)$/);return m?parseInt(m[1]):0;});
  const next=(Math.max(0,...nums)+1).toString().padStart(4,'0');
  return `WORK-NOVA-${next}`;
};

const resizeImg=(file,cb)=>{
  const r=new FileReader();
  r.onload=e=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');const max=500;let w=img.width,h=img.height;if(w>max){h=h*max/w;w=max;}if(h>max){w=w*max/h;h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);cb(c.toDataURL('image/jpeg',.65));};img.src=e.target.result;};
  r.readAsDataURL(file);
};

  const errEl=document.getElementById('rerr');
  const btn=document.getElementById('regBtn');

  const showErr=(msg)=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}if(btn){btn.textContent='SUBMIT REGISTRATION →';btn.disabled=false;}};
  if(errEl)errEl.style.display='none';

  if(!name){showErr('Full Name is required.');return;}
  if(!email||!/\S+@\S+\.\S+/.test(email)){showErr('Enter a valid email address.');return;}
  if(!pass||pass.length<6){showErr('Password must be at least 6 characters.');return;}
  if(pass!==conf){showErr('Passwords do not match.');return;}

  if(btn){btn.textContent='Submitting...';btn.disabled=true;}

  // Pull latest data so Worker ID is guaranteed unique
  try{await forceSyncDown();}catch(e){loadLocal();}

  // Check if this email already has a registration
  const existing=C.regs.find(x=>x.email.toLowerCase()===email.toLowerCase());
  if(existing){
    if(existing.status==='pending'){
      showRegistrationStatus(existing,'pending');return;
    } else if(existing.status==='approved'){
      showRegistrationStatus(existing,'approved');return;
    } else if(existing.status==='rejected'){
      // Allow re-registration after rejection? Show their status.
      showRegistrationStatus(existing,'rejected');return;
    }
  }

  // Generate unique Worker ID (fresh after sync)
  const workerId=generateWorkerId();

  const reg={
    id:'REG-'+uid(),
    workerId,
    name,email,phone,username,
    password:pass, // stored in Firebase (same as worker accounts)
    status:'pending',
    requestedAt:Date.now(),
    processedAt:null,
    rejectionReason:''
  };

  const regs=DB.regs();
  regs.push(reg);
  DB.sreg(regs);

  // Show success page
  showRegistrationSuccess(reg);
};

// WORKER LOGIN — checks approved workers only; pending workers see status page
window.workerLogin=async()=>{
  if(_loginBusy)return;
  const key=(document.getElementById('wk')?.value||'').trim().toUpperCase().replace(/\s/g,'');
  const pass=(document.getElementById('wp')?.value||'').trim();
  const errEl=document.getElementById('lerr');
  const btn=document.getElementById('wlBtn');
  const showErr=(msg)=>{if(errEl){errEl.textContent=msg;errEl.style.display='block';}if(btn){btn.textContent='LOGIN →';btn.disabled=false;}_loginBusy=false;};
  const setBtn=(t)=>{if(btn){btn.textContent=t;btn.disabled=true;}};
  if(errEl)errEl.style.display='none';
  if(!key){showErr('Please enter your Worker Key.');return;}
  if(!pass){showErr('Please enter your password.');return;}
  if(!key.startsWith('WORK-NOVA-')){showErr('Invalid key format. Example: WORK-NOVA-0001');return;}
  _loginBusy=true;setBtn('Syncing...');

  // Always pull fresh data first so we have the latest approved workers + registrations
  try{await forceSyncDown();}catch(e){if(!C.loaded)loadLocal();}

  setBtn('Verifying...');

  // 1. Check in approved workers (the only ones who can login)
  const w=C.workers.find(x=>x.id===key);
  if(w){
    if(w.blocked){showErr('Your account has been blocked. Contact admin.');return;}
    if((w.password||'').trim()!==pass){showErr('Incorrect password. Please try again.');return;}
    // ✅ Approved worker login success
    S.user=w;S.role='worker';S.tab='dash';_loginBusy=false;
    saveSession();toast('Welcome back, '+(w.name||w.id)+'! 👋','success');
    render();startWorkerPolling();return;
  }

  // 2. Check in registrations (pending/approved-not-yet-moved/rejected)
  const reg=C.regs.find(x=>x.workerId===key);
  if(reg){
    _loginBusy=false;
    if(btn){btn.textContent='LOGIN →';btn.disabled=false;}
    if(reg.status==='pending'){
      // Show pending status page — do NOT grant access
      if((reg.password||'').trim()!==pass){showErr('Incorrect password. Please try again.');return;}
      showRegistrationStatus(reg,'pending');return;
    }
    if(reg.status==='rejected'){
      showRegistrationStatus(reg,'rejected');return;
    }
    if(reg.status==='approved'){
      // Edge case: approved but worker record not yet in workers array — shouldn't happen
      showErr('Your account was approved but not found. Please contact admin.');return;
    }
  }

  // 3. Not found anywhere
  showErr('Worker Key not found. Make sure you entered the correct key (e.g. WORK-NOVA-0001). If you haven\'t registered yet, use New Registration.');
};

const renderWorker=()=>{
  if(!S.user||!S.user.id){clearSession();S.user=null;S.role=null;renderLanding();return;}
  const fresh=C.workers.find(x=>x.id===S.user.id);
  if(!fresh||fresh.blocked){clearSession();S.user=null;S.role=null;toast('Session ended. Please login again.','warn');renderLanding();return;}
  S.user=fresh;

const wDash=(w)=>{

  const availJobs=DB.jobs().filter(x=>x.active&&(x.expiry===0||x.expiry>Date.now())&&x.slotsLeft>0).length;

  </div>
  <div class="sg">
    <div class="sc"><div class="sv" style="color:var(--gr)">${done.length}</div><div class="sl">✅ Completed</div></div>
    <div class="sc"><div class="sv" style="color:var(--yw)">${subs.filter(x=>x.status==='pending').length}</div><div class="sl">⏳ Pending</div></div>

    ${anns.length?anns.map(a=>`<div class="ann"><div class="ann-title">📢 ${esc(a.title)}</div><div class="ann-body">${esc(a.body)}</div><div class="ann-time">${fmtD(a.time)}</div></div>`).join(''):''}
    <div class="card" style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0"><div style="font-size:12px;font-weight:700;color:var(--cy)">📈 THIS WEEK</div><div style="font-size:11px;color:var(--tx2)">${fmt(weekData.reduce((a,x)=>a+x,0))}</div></div>
      <div class="bar-chart">${weekData.map((v,i)=>`<div class="bar-col"><div class="bar" style="height:${Math.round((v/maxW)*66)+4}px"></div><div class="bar-lbl">${days[i]}</div></div>`).join('')}</div>

      <div class="sc" style="text-align:left;padding:13px"><div style="font-size:10px;color:var(--tx2);margin-bottom:4px">🎯 SUCCESS RATE</div><div style="font-size:28px;font-weight:900;color:var(--gr)">${rate}%</div><div style="font-size:10px;color:var(--tx3)">${done.length} of ${subs.length} tasks</div></div>

    <div class="card" style="margin-bottom:12px">
      <div style="font-size:12px;font-weight:700;color:var(--cy);margin-bottom:10px">🏆 TOP EARNERS</div>

    </div>
    <div class="card">
      <div style="font-size:12px;font-weight:700;color:var(--cy);margin-bottom:10px">⚡ RECENT ACTIVITY</div>
      ${subs.length===0?'<div style="font-size:12px;color:var(--tx3)">No activity yet</div>':subs.slice(-6).reverse().map(s=>{const j=DB.jobs().find(x=>x.id===s.jobId);const clr=s.status==='approved'?'green':s.status==='rejected'?'red':'yellow';return`<div class="af-item"><div class="af-dot ${clr}"></div><div><div class="af-text">${esc(j?.title||'Job')}</div><div class="af-time">${fmtD(s.submittedAt||s.takenAt)} · ${fmt(j?.rate||0)} · <span class="bx bx-${s.status==='approved'?'g':s.status==='rejected'?'r':'y'}" style="font-size:9px">${s.status.toUpperCase()}</span></div></div></div>`;}).join('')}

window.takeJob=(jid)=>{
  if(DB.subs().find(x=>x.workerId===S.user.id&&x.status==='taken')){toast('Release your current job first!','error');return;}
  const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===jid);
  if(ji===-1||jobs[ji].slotsLeft<=0||(jobs[ji].expiry>0&&jobs[ji].expiry<Date.now())){toast('Job no longer available','error');return;}
  jobs[ji].slotsLeft--;DB.sj(jobs);
  const sub={id:uid(),jobId:jid,workerId:S.user.id,status:'taken',takenAt:Date.now(),deadline:Date.now()+30*60*1000,proof:null,submittedAt:null};
  const subs=DB.subs();subs.push(sub);DB.ss(subs);
  DB.addN(S.user.id,`Job taken: "${jobs[ji].title}". Submit proof in 30 min!`,'info');
  toast('Job taken! Submit proof within 30 min ✅','success');renderWorker();
};
window.releaseJob=(subId)=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);
  if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}
  subs.splice(si,1);DB.ss(subs);toast('Job released','info');renderWorker();
};
window.autoReleaseJob=(subId)=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);
  if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}
  subs.splice(si,1);DB.ss(subs);renderWorker();
};
window.openSubmitProof=(subId,jobId)=>{S.modal={type:'proof',subId,jobId};renderWorker();};

window.requestPay=()=>{
  const upi=(document.getElementById('upi')?.value||'').trim();
  const amt=parseFloat(document.getElementById('wamt')?.value||'0');
  if(!upi){toast('Enter UPI ID','error');return;}if(!amt||amt<20){toast('Minimum ₹20','error');return;}
  const w=S.user;if(amt>w.balance){toast('Insufficient balance','error');return;}
  const ws=DB.workers();const wi=ws.findIndex(x=>x.id===w.id);
  ws[wi].upiId=upi;ws[wi].balance=parseFloat((ws[wi].balance-amt).toFixed(2));DB.sw(ws);S.user=ws[wi];
  const pays=DB.pays();pays.push({id:'PAY-'+uid(),workerId:w.id,amount:amt,upiId:upi,status:'pending',requestedAt:Date.now(),note:''});DB.sp(pays);
  DB.addN(w.id,`Withdrawal of ${fmt(amt)} requested. Awaiting approval.`,'info');
  toast('Withdrawal requested ✅','success');renderWorker();
};

// APPROVE REGISTRATION: creates worker account from the registration data
window.approveReg=(regId)=>{
  const regs=DB.regs();
  const ri=regs.findIndex(x=>x.id===regId);if(ri===-1)return;
  const reg=regs[ri];
  if(reg.status!=='pending'){toast('Already processed','warn');return;}

  // Create worker account from registration data
  const ws=DB.workers();
  if(ws.find(x=>x.id===reg.workerId)){
    // ID already exists (edge case) — just mark approved
    regs[ri].status='approved';regs[ri].processedAt=Date.now();DB.sreg(regs);
    DB.addN(reg.workerId,'✅ Your registration has been APPROVED! You can now login.','info');
    toast('Registration approved ✅','success');renderOwner();return;
  }

  // Add to workers array (full account created)
  ws.push({
    id:reg.workerId,
    name:reg.name,
    username:reg.username||'',
    email:reg.email,
    phone:reg.phone||'',
    password:reg.password, // same password they set during registration
    balance:0,
    totalEarned:0,
    blocked:false,
    upiId:'',
    joinedAt:Date.now()
  });
  DB.sw(ws);

  // Mark registration as approved
  regs[ri].status='approved';regs[ri].processedAt=Date.now();
  DB.sreg(regs);

  // Notify worker
  DB.addN(reg.workerId,`✅ Your registration has been APPROVED! Welcome to Elite Earner! Login with your Worker Key: ${reg.workerId}`,'info');

  toast(`✅ ${reg.name} approved! Worker account created.`,'success');
  renderOwner();
};

};

window.rejectReg=(regId,reason='')=>{
  const regs=DB.regs();const ri=regs.findIndex(x=>x.id===regId);if(ri===-1)return;

  DB.addN(regs[ri].workerId,`❌ Your registration was rejected.${reason?' Reason: '+reason:' Contact admin for more info.'}`,'info');

};

window.createJob=()=>{
  const t=S.jobType||'mini';
  const title=(document.getElementById('jt_')?.value||'').trim();const desc=(document.getElementById('jd_')?.value||'').trim();
  const tut=(document.getElementById('jtu_')?.value||'').trim();const com=(document.getElementById('jco_')?.value||'').trim();
  const rate=parseFloat(document.getElementById('jr_')?.value||'0');const slots=parseInt(document.getElementById('js_')?.value||'0');
  const expMin=parseInt(document.getElementById('je_')?.value||'0')||0;
  if(!title){toast('Job title required','error');return;}if(!desc){toast('Description required','error');return;}
  if(!rate||rate<=0){toast('Enter valid rate','error');return;}if(!slots||slots<=0){toast('Enter valid slots','error');return;}
  const job={id:'JOB-'+uid(),title,description:desc,tutorial:tut,comment:com,rate,slots,slotsLeft:slots,expiry:expMin>0?Date.now()+expMin*60*1000:0,active:true,createdAt:Date.now(),jobType:t};
  if(t==='app'){job.appName=document.getElementById('appName')?.value||'';job.appStore=document.getElementById('appStore')?.value||'';job.appLink=document.getElementById('appLink')?.value||'';job.appRating=document.getElementById('appRating')?.value||'5';job.appMinWords=document.getElementById('appMinW')?.value||'30';job.appScreenshot=document.getElementById('appSS')?.value==='yes';}
  else if(t==='map'){job.mapBusiness=document.getElementById('mapBiz')?.value||'';job.mapLink=document.getElementById('mapLink')?.value||'';job.mapLocation=document.getElementById('mapLoc')?.value||'';job.mapRating=document.getElementById('mapRating')?.value||'5';job.mapMinWords=document.getElementById('mapMinW')?.value||'15';job.mapScreenshot=document.getElementById('mapSS')?.value==='yes';}
  else if(t==='kyc'){job.kycPlatform=document.getElementById('kycPlat')?.value||'';job.kycType=document.getElementById('kycType')?.value||'';job.kycDocs=document.getElementById('kycDocs')?.value||'';job.kycSteps=document.getElementById('kycSteps')?.value||'';}
  const jobs=DB.jobs();jobs.push(job);DB.sj(jobs);
  DB.workers().forEach(w=>DB.addN(w.id,`🆕 New job: "${title}" — ${fmt(rate)}. Available now!`,'info'));
  toast('Job published ✅ All workers notified!','success');renderOwner();
};
window.toggleJob=(jid)=>{const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===jid);if(ji!==-1){jobs[ji].active=!jobs[ji].active;DB.sj(jobs);}renderOwner();};
window.deleteJob=(jid)=>{DB.sj(DB.jobs().filter(x=>x.id!==jid));toast('Job deleted','success');renderOwner();};

const oPay=()=>{
  const pend=DB.pays().filter(x=>x.status==='pending');
  const hist=DB.pays().filter(x=>x.status!=='pending').slice().reverse().slice(0,20);
  return `<div class="pg"><div class="pt">Payments</div><div class="ps">${pend.length} pending · ${DB.pays().filter(x=>x.status==='paid').length} paid total</div>

  ${hist.length?`<div class="dv"></div><div class="sec-hd"><div class="sec-t">History</div></div>${hist.map(p=>{const w=DB.workers().find(x=>x.id===p.workerId)||{name:p.workerId};return`<div class="pi"><div class="pi-l"><h4>${esc(w.name||p.workerId)}</h4><p>${esc(p.upiId)} · ${fmtD(p.requestedAt)}</p>${p.note?`<p style="color:var(--tx3)">${esc(p.note)}</p>`:''}</div><div class="pi-r"><div class="pi-amt">${fmt(p.amount)}</div><span class="bx ${p.status==='paid'?'bx-g':p.status==='returned'?'bx-tl':'bx-r'}" style="margin-top:4px;display:inline-flex">${p.status==='paid'?'✅ PAID':p.status==='returned'?'↩️ RETURNED':'❌ REJECTED'}</span></div></div>`;}).join('')}`:''}
  </div>`;
};
window.processPay=(pid,status)=>{
  const pays=DB.pays();const pi=pays.findIndex(x=>x.id===pid);if(pi===-1)return;
  const p=pays[pi];pays[pi].status=status;pays[pi].processedAt=Date.now();
  if(status==='paid'){DB.addN(p.workerId,`✅ Payment of ${fmt(p.amount)} PAID to ${p.upiId}! 🎉`,'info');}
  else if(status==='returned'||status==='rejected'){const ws=DB.workers();const wi=ws.findIndex(x=>x.id===p.workerId);if(wi!==-1){ws[wi].balance=parseFloat((ws[wi].balance+p.amount).toFixed(2));DB.sw(ws);}pays[pi].note=status==='returned'?'Returned — balance refunded':'Rejected — balance refunded';DB.addN(p.workerId,`${status==='returned'?'↩️ Payment returned':'❌ Payment rejected'}. ${fmt(p.amount)} refunded.`,'info');}
  DB.sp(pays);toast('Payment updated ✅','success');renderOwner();
};

window.viewProof=(src)=>{const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:999;display:flex;align-items:center;justify-content:center;cursor:pointer';d.innerHTML=`<img src="${src}" style="max-width:96vw;max-height:90vh;border-radius:8px;object-fit:contain">`;d.onclick=()=>d.remove();document.body.appendChild(d);};
window.reviewProof=(subId,status,reason='')=>{
  const subs=DB.subs();const si=subs.findIndex(x=>x.id===subId);if(si===-1)return;
  const s=subs[si];const j=DB.jobs().find(x=>x.id===s.jobId)||{rate:0,title:'Job'};
  subs[si].status=status;subs[si].reviewedAt=Date.now();subs[si].rejectReason=reason;DB.ss(subs);
  if(status==='approved'){const ws=DB.workers();const wi=ws.findIndex(x=>x.id===s.workerId);if(wi!==-1){ws[wi].balance=parseFloat(((ws[wi].balance||0)+j.rate).toFixed(2));ws[wi].totalEarned=parseFloat(((ws[wi].totalEarned||0)+j.rate).toFixed(2));DB.sw(ws);}DB.addN(s.workerId,`✅ Job "${j.title}" APPROVED! ${fmt(j.rate)} credited to your balance. 💰`,'info');}
  else{const jobs=DB.jobs();const ji=jobs.findIndex(x=>x.id===s.jobId);if(ji!==-1){jobs[ji].slotsLeft=Math.min(jobs[ji].slots,jobs[ji].slotsLeft+1);DB.sj(jobs);}DB.addN(s.workerId,`❌ Job "${j.title}" rejected.${reason?' Reason: '+reason:''}`,'info');}
  toast(`Proof ${status} ✅`,'success');renderOwner();
};
window.rejectProofPr=(subId)=>{const r=prompt('Rejection reason (optional):');reviewProof(subId,'rejected',r||'');};

window.doAdjBal=(wid)=>{
  const adj=parseFloat(document.getElementById('balAdj')?.value||'');const reason=(document.getElementById('balR')?.value||'').trim();

  const ws=DB.workers();const wi=ws.findIndex(x=>x.id===wid);if(wi===-1)return;
  ws[wi].balance=parseFloat(Math.max(0,(ws[wi].balance||0)+adj).toFixed(2));
  if(adj>0)ws[wi].totalEarned=parseFloat(((ws[wi].totalEarned||0)+adj).toFixed(2));
  DB.sw(ws);DB.addN(wid,`Balance ${adj>=0?'increased':'decreased'} by ${fmt(Math.abs(adj))}.${reason?' Reason: '+reason:''}`,'info');
  toast('Balance adjusted ✅','success');S.modal=null;renderOwner();
};
window.doResetPass=(wid)=>{

};
window.deleteWorker=(wid)=>{

  const ags=DB.agents();ags.forEach(ag=>{ag.teamWorkers=(ag.teamWorkers||[]).filter(x=>x!==wid);});DB.sa(ags.filter(x=>x.workerId!==wid));

window.createAgent=()=>{
  const wid=(document.getElementById('agWid')?.value||'').trim().toUpperCase();const agId=(document.getElementById('agId')?.value||'').trim().toUpperCase();

  const ags=DB.agents();const ai=ags.findIndex(x=>x.workerId===wid);
  if(ai!==-1){ags[ai].approved=true;ags[ai].agentId=agId;DB.sa(ags);}
  else{ags.push({id:uid(),agentId:agId,workerId:wid,approved:true,teamWorkers:[],createdAt:Date.now()});DB.sa(ags);}
  DB.addN(wid,`✅ Agent access granted! Your Agent ID: ${agId}.`,'info');
  toast(`Agent created: ${agId}`,'success');S.modal=null;renderOwner();
};
window.postAnn=()=>{
  const t=(document.getElementById('annT')?.value||'').trim();const b=(document.getElementById('annB')?.value||'').trim();
  if(!t||!b){toast('Fill title and message','error');return;}
  const anns=DB.anns();anns.unshift({id:uid(),title:t,body:b,time:Date.now()});DB.san(anns.slice(0,20));
  DB.workers().forEach(w=>DB.addN(w.id,`📢 ${t}`,'info'));
  toast('Announcement posted ✅','success');S.modal=null;renderOwner();
};

// ══════════════════════════════════════════════════
// BOOTSTRAP
// ══════════════════════════════════════════════════
const setLoad=(msg)=>{const el=document.getElementById('loadMsg');if(el)el.textContent=msg;};
const hideLoad=()=>{const el=document.getElementById('loadScreen');if(el){el.style.opacity='0';el.style.transition='opacity .4s';setTimeout(()=>el?.remove(),400);}};

(async()=>{
  setLoad('Fetching latest data...');
  try{await forceSyncDown();}catch(e){loadLocal();_syncSt='err';}
  setLoad('Ready!');restoreSession();hideLoad();render();
  if(S.role==='worker')startWorkerPolling();
  else if(S.role==='owner')startAdminPolling();
  // Auto-expire jobs every 60s
  setInterval(()=>{const jobs=DB.jobs();let ch=false;jobs.forEach(j=>{if(j.expiry>0&&j.expiry<Date.now()&&j.active){j.active=false;ch=true;}});if(ch)DB.sj(jobs);},60000);
})();
</script>
